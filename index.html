<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080f24" />
  <title>Papyrus</title>
  <link rel="stylesheet" href="style.css?v=b514b56" />
</head>
<body>
  <main class="app">
    <header><span class="brand"><span class="brand-mark" role="img" aria-label="Neptune">♆</span> Papyrus</span><span class="version">0.1</span></header>
    <section class="canvas" aria-label="Growing illustration">
      <svg id="scene" viewBox="0 0 320 300" role="img" aria-label="A branching tree gradually drawn as your words dissolve into it">
        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop stop-color="#1e3c78"/><stop offset="1" stop-color="#0a142e"/>
          </linearGradient>
          <radialGradient id="neptune" cx="30%" cy="25%" r="85%">
            <stop stop-color="#86c0ff"/>
            <stop offset="0.45" stop-color="#3e7ee3"/>
            <stop offset="1" stop-color="#182d75"/>
          </radialGradient>
          <clipPath id="planet-disc"><circle cx="255" cy="65" r="23"/></clipPath>
        </defs>
        <rect width="320" height="300" fill="url(#sky)" />
        <circle cx="255" cy="65" r="29" fill="#508bef" opacity=".06" />
        <circle cx="255" cy="65" r="23" fill="url(#neptune)" />
        <g clip-path="url(#planet-disc)" fill="none" stroke-linecap="round">
          <path d="M228 53 Q250 61 281 55" stroke="#bddfff" stroke-width="3" opacity=".24"/>
          <path d="M228 66 Q253 74 282 67" stroke="#16388c" stroke-width="5" opacity=".3"/>
          <path d="M232 77 Q256 83 279 76" stroke="#b1d3ff" stroke-width="2" opacity=".2"/>
        </g>
        <path d="M0 280 Q90 258 170 277 T320 270 V300 H0Z" fill="#172c50" />
        <g id="tree" aria-hidden="true"></g>
      </svg>
      <div class="progress" id="progress">Every word leaves a trace. Land a green branch.</div>
    </section>
    <label for="writing">Your words</label>
    <div class="writing-wrap" id="writingWrap"><textarea id="writing" spellcheck="true" placeholder="Begin writing…" aria-label="Your private writing"></textarea></div>
    <div class="controls"><button id="toggle" type="button">Reveal words</button><button id="export" type="button">Export .md</button><button id="clear" type="button">Clear</button></div>
    <p class="note">Saved in this browser on this device. Not encrypted. Avoid sensitive writing until stronger protection is added.</p>
  </main>
  <script src="app.js?v=b514b56"></script>
</body>
</html>
